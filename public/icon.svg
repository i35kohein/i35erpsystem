<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#004BA8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- CircleDot mark: outer ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-width="36"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="46" fill="#FFFFFF"/>
  <!-- Small orbit dots (repair/ops motif) -->
  <circle cx="256" cy="96" r="22" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="416" cy="256" r="22" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="256" cy="416" r="22" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="96" cy="256" r="22" fill="#FFFFFF" opacity="0.9"/>
</svg>
